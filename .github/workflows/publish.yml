name: Publish to NPM

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build package
        run: npm run build

      - name: Bump version and prepare release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          CURRENT=$(grep '"version"' package.json | head -1 | sed 's/.*"version": "\([^"]*\)".*/\1/')
          NEW=$(echo $CURRENT | awk -F. '{$NF=$NF+1;}1' OFS=.)

          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW\"/" package.json

          git add package.json
          git commit -m "chore: bump version to $NEW" || true
          git tag "v$NEW" || true
          git push origin main || true
          git push origin "v$NEW" || true

          echo "VERSION=$NEW" >> $GITHUB_ENV

      - name: Publish to NPM
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: |
            Published to NPM: [@jabezpauls/md-converter@${{ env.VERSION }}](https://www.npmjs.com/package/@jabezpauls/md-converter)
          token: ${{ secrets.GITHUB_TOKEN }}
